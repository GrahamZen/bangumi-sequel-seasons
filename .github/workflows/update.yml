# 每天看一眼: Bangumi 导出换了, 或 izuko-tv 的续作判据版本变了, 就重出续作候选季表并提交回本仓库;
# 导出换了也重出系列关系图 (纯 Python, 不构建 izuko-tv). 都没变时只跑 plan (取两个小文件, 几秒钟), 不下导出也不构建.
# 各步骤的逻辑在 scripts/ci.sh (本地用 `scripts/ci.sh local` 跑同一套); 这里只另外存取缓存与提交.
name: update

on:
  schedule:
    # UTC 23:00 = 北京时间 07:00. Bangumi 导出每周三 05:00 (北京时间) 前后更新
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '导出与判据版本都没变也重出'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      FORCE: ${{ inputs.force || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Plan
        id: plan
        run: scripts/ci.sh plan

      - name: Download and prepare Bangumi Archive
        if: steps.plan.outputs.due == '1' || steps.plan.outputs.due_graph == '1'
        run: scripts/ci.sh download prepare

      - name: Build series graph
        if: steps.plan.outputs.due_graph == '1'
        run: scripts/ci.sh graph

      - name: Checkout izuko-tv
        if: steps.plan.outputs.due == '1'
        run: scripts/ci.sh izuko

      - name: Install JBR
        if: steps.plan.outputs.due == '1'
        run: scripts/ci.sh jdk

      - uses: actions/cache/restore@v4
        id: gradle-cache
        if: steps.plan.outputs.due == '1'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ env.IZUKO_SHA }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build table
        if: steps.plan.outputs.due == '1'
        run: scripts/ci.sh build

      - name: Commit
        if: steps.plan.outputs.due == '1' || steps.plan.outputs.due_graph == '1'
        run: |
          set -euo pipefail
          git add bgm-sequel-seasons.tsv bgm-series-graph.tsv
          if git diff --cached --quiet; then echo "没有变化"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 两张表不一定都重出了, 少了哪份说明就不写
          # 两张表不一定都重出了, 少了哪份说明就不写
          summary=$( (cat "$RUNNER_TEMP/work/summary.txt" "$RUNNER_TEMP/work/graph-summary.txt" 2>/dev/null || true) | paste -sd ';' -)
          git commit -q -m "update $(date -u +%F): $summary"
          git push
          # jsDelivr 按分支缓存, 推完主动刷新
          for f in bgm-sequel-seasons.tsv bgm-series-graph.tsv; do
            curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f" > /dev/null || true
          done

      # 一个 izuko-tv 版本只存一份 (一份 1 GB 多, 仓库缓存共 10 GB): 开头按这个版本精确恢复到了就不再存;
      # 换了版本从最近那份接着编, 编完存成新版本的. 失败的那一轮也存: 下载的依赖与编译产物照样有用, 不然每次重试都是冷构建
      - uses: actions/cache/save@v4
        if: always() && steps.plan.outputs.due == '1' && steps.gradle-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ env.IZUKO_SHA }}
